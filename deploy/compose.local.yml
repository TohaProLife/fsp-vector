name: vector-local
x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://vector:${PG_APP_PASSWORD:?Run prepare_compose.py}@db:5432/vector
  LOCAL_DEMO: "true"
  AUTO_SEED: "true"
  AUTO_CREATE_SCHEMA: "false"
  COOKIE_SECURE: "false"
  FRONTEND_URL: http://localhost:3000
  STORAGE_DIR: /app/storage
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SENDER: noreply@vector.local
  ATS_WEBHOOK_URL: http://ats-receiver:8090/events
  ATS_WEBHOOK_SECRET: ${ATS_WEBHOOK_SECRET:?Run prepare_compose.py}
  OIDC_ISSUER: http://localhost:8081/realms/vector
  OIDC_INTERNAL_ISSUER: http://identity:8080/realms/vector
  OIDC_CLIENT_ID: vector-web
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run prepare_compose.py}
  OIDC_REDIRECT_URI: http://localhost:3000/api/v1/auth/oidc/callback
  MATCH_SEMANTIC_ENABLED: "false"
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: vector_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Run prepare_compose.py}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?Run prepare_compose.py}
      PG_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD:?Run prepare_compose.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-vector.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vector_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-environment
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-environment
    volumes: ["storage:/app/storage"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-environment
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
      ats-receiver: {condition: service_started}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: {API_ORIGIN: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  identity:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start-dev, --import-realm, --hostname=http://localhost:8081]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: vector-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run prepare_compose.py}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/vector_identity
      KC_DB_USERNAME: vector_identity
      KC_DB_PASSWORD: ${PG_IDENTITY_PASSWORD:?Run prepare_compose.py}
      JAVA_OPTS_APPEND: -Xms128m -Xmx512m
    volumes: ["../.local/compose/vector-realm.json:/opt/keycloak/data/import/vector-realm.json:ro"]
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:8025:8025"]
    environment: {MP_DATABASE: /data/mailpit.db}
    volumes: ["mail:/data"]
    restart: unless-stopped
  ats-receiver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ATS_WEBHOOK_SECRET: ${ATS_WEBHOOK_SECRET:?Run prepare_compose.py}
      ATS_RECEIVER_DB: /app/storage/ats-inbox.sqlite3
    command: [python, -m, uvicorn, services.integrations.receiver:app, --app-dir, /app, --host, 0.0.0.0, --port, "8090"]
    volumes: ["ats:/app/storage"]
    ports: ["127.0.0.1:8090:8090"]
    restart: unless-stopped
volumes:
  postgres:
  storage:
  ats:
  mail:
