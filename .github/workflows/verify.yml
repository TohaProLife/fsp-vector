name: Verification
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - run: pip install -r deploy/requirements.lock
      - run: pip install --no-deps -e 'services/api[test]'
      - run: python -m pytest services/api/tests tests/integration -q
        env: {AUTO_SEED: 'false', AUTO_CREATE_SCHEMA: 'true', LOCAL_DEMO: 'true'}
      - run: python scripts/export_contract.py
      - name: Verify OpenAPI contract
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = json.loads(subprocess.check_output(['git', 'show', 'HEAD:docs/api/openapi.json']))
          actual = json.loads(Path('docs/api/openapi.json').read_text(encoding='utf-8'))
          assert actual == expected, 'OpenAPI contract changed'
          PY
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - run: pip install -r deploy/requirements.lock && pip install --no-deps -e services/api
      - name: Start isolated CI catalog API
        run: |
          PYTHONPATH=services/api AUTO_SEED=false AUTO_CREATE_SCHEMA=true python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/vector-catalog.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test:routes
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env: {NEXT_TELEMETRY_DISABLED: '1'}
